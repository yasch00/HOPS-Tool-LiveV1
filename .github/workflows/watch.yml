name: watch
on:
  schedule:
    - cron: '20 6 * * *'        # daily 06:20 UTC (GitHub may delay scheduled runs under load)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'How far back to collect (days). Use 365 for the first backfill.'
        default: '3'
      max_items:
        description: 'Cap on items sent to the model this run'
        default: '150'
      pages:
        description: 'Pages of 50 per API source (raise to 6 for a backfill)'
        default: '1'
permissions:
  contents: write
  models: read                 # GitHub Models inference with the job's own token — the free default screener
concurrency: watch
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: watch/requirements.txt
      - run: pip install -r watch/requirements.txt
      - name: Collect and screen
        run: python watch/watch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WATCH_ENDPOINT: ${{ vars.WATCH_ENDPOINT }}
          WATCH_API_KEY: ${{ secrets.WATCH_API_KEY }}
          # WATCH_MODEL repo variable: github:openai/gpt-4o-mini (default, FREE via GitHub Models) · openai:<model> with WATCH_ENDPOINT/WATCH_API_KEY
          # (Groq / Gemini free tiers) · claude-haiku-4-5-20251001 (paid) · none (keyword mode, no model)
          WATCH_MODEL: ${{ vars.WATCH_MODEL || 'github:openai/gpt-4o-mini' }}
          WATCH_LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
          WATCH_MAX_ITEMS: ${{ inputs.max_items || '150' }}
          WATCH_PAGES: ${{ inputs.pages || '1' }}
      - name: Commit the feed
        run: |
          git config user.name "hops-watch"
          git config user.email "hops-watch@users.noreply.github.com"
          git add data/watch.json data/watch
          git diff --cached --quiet || (git commit -m "watch: $(date -u +%F)" && git push)
